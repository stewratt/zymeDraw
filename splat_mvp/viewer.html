<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>SHARP splat viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd;
               font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; top: 10px; left: 10px; z-index: 10; display: flex;
         gap: 8px; align-items: center; background: rgba(0,0,0,.55);
         padding: 8px 10px; border-radius: 8px; }
  select, button, label.btn { font: inherit; background: #222; color: #ddd;
                   border: 1px solid #444; border-radius: 4px; padding: 4px 8px; }
  label.btn { cursor: pointer; }
  #file { display: none; }
  #status { opacity: .8; }
  #help { position: fixed; bottom: 10px; left: 10px; z-index: 10; opacity: .5; }
  #drop { position: fixed; inset: 0; z-index: 20; display: none;
          align-items: center; justify-content: center; font-size: 20px;
          background: rgba(0,0,0,.7); border: 3px dashed #666; }
  #drop.on { display: flex; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
  }
}
</script>
</head>
<body>
<div id="hud">
  <select id="plyList"></select>
  <button id="reload">refresh list</button>
  <button id="reset">reset view</button>
  <label class="btn" for="file">open image…</label>
  <input id="file" type="file" accept="image/*,.heic" />
  <span id="status">–</span>
</div>
<div id="drop">drop an image to splat it</div>
<div id="help">drag = orbit · right-drag = pan · scroll = dolly · drop an image anywhere</div>
<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const statusEl = document.getElementById('status');
const listEl = document.getElementById('plyList');
let viewer = null;

// SHARP uses the OpenCV convention: x right, y DOWN, z forward, camera at the
// origin, scene centered near (0, 0, +z). So "reset" = the original photo's view.
const CAM = {
  up: [0, -1, 0],
  position: [0, 0, 0],
  lookAt: [0, 0, 2],
};

async function listPlys() {
  try {
    const { plys } = await fetch('/api/plys').then((r) => r.json());
    return plys || [];
  } catch {
    return [];
  }
}

async function refreshList() {
  const names = await listPlys();
  listEl.innerHTML = '';
  for (const n of names) {
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = n;
    listEl.appendChild(opt);
  }
  return names;
}

async function load(ply) {
  if (!ply) { statusEl.textContent = 'no .ply files in out/ yet'; return; }
  if (viewer) { await viewer.dispose(); viewer = null; }
  statusEl.textContent = `loading ${ply} …`;
  viewer = new GaussianSplats3D.Viewer({
    cameraUp: CAM.up,
    initialCameraPosition: CAM.position,
    initialCameraLookAt: CAM.lookAt,
    sphericalHarmonicsDegree: 2,
    sharedMemoryForWorkers: false, // server.py sends no COOP/COEP headers
  });
  await viewer.addSplatScene('out/' + ply, { showLoadingUI: true });
  viewer.start();
  statusEl.textContent = ply;
}

document.getElementById('reset').onclick = () => {
  if (!viewer) return;
  viewer.camera.position.set(...CAM.position);
  viewer.camera.up.set(...CAM.up);
  viewer.controls.target.set(...CAM.lookAt);
  viewer.controls.update();
};
document.getElementById('reload').onclick = async () => {
  const names = await refreshList();
  if (names.length) load(listEl.value);
};
listEl.onchange = () => load(listEl.value);

let busy = false;

async function predict(file) {
  if (busy) return;
  busy = true;
  try {
    statusEl.textContent = `uploading ${file.name} …`;
    const res = await fetch('/api/predict', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/octet-stream',
        // headers are ASCII-only; the server percent-decodes this
        'X-Filename': encodeURIComponent(file.name),
      },
      body: file,
    });
    statusEl.textContent = 'predicting… (first run loads the 2.7GB model, ~20s)';
    const data = await res.json();
    if (!data.ok) { statusEl.textContent = 'error: ' + data.error; return; }
    const names = await refreshList();
    if (names.includes(data.ply)) listEl.value = data.ply;
    await load(data.ply);
    statusEl.textContent = `${data.ply} · ${data.seconds}s`;
  } catch (err) {
    statusEl.textContent = 'error: ' + err.message;
  } finally {
    busy = false;
  }
}

const fileEl = document.getElementById('file');
fileEl.onchange = () => { if (fileEl.files[0]) predict(fileEl.files[0]); fileEl.value = ''; };

const dropEl = document.getElementById('drop');
let dragDepth = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); if (++dragDepth) dropEl.classList.add('on'); });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove('on'); } });
addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  dropEl.classList.remove('on');
  const file = e.dataTransfer.files[0];
  if (file) predict(file);
});

const names = await refreshList();
const wanted = new URLSearchParams(location.search).get('ply');
if (wanted && names.includes(wanted)) listEl.value = wanted;
load(listEl.value);
</script>
</body>
</html>
